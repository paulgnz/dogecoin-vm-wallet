# XcodeGen spec: the source of truth for the Xcode project.
# Regenerate with: xcodegen generate
name: DogecoinVMWallet
options:
  bundleIdPrefix: com.metaldoge
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.2"
    CURRENT_PROJECT_VERSION: "1"
    # DEVELOPMENT_TEAM comes from Signing.xcconfig (gitignored). A stable team
    # keeps the Secure Enclave–wrapped key readable across builds.
    ENABLE_HARDENED_RUNTIME: true
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: true
    ENABLE_USER_SCRIPT_SANDBOXING: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

schemes:
  DogecoinVMWallet:
    build:
      targets:
        DogecoinVMWallet: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  DogecoinVMWallet:
    type: application
    platform: macOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    dependencies:
      - package: Sparkle
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"
          - "DogecoinVMWallet.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.metaldoge.wallet
        PRODUCT_NAME: DogecoinVM Wallet
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/DogecoinVMWallet.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: true
        # The Rust core (scripts/build-core-macos.sh builds it).
        SWIFT_OBJC_BRIDGING_HEADER: Vendor/DogecoinVMWallet-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Vendor/include"]
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Vendor"]
        OTHER_LDFLAGS: ["$(inherited)", "-ldogevm_wallet_core"]
