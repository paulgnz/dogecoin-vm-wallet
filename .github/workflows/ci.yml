name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core tests (must match the web wallet's vectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path core/Cargo.toml

  secretscan:
    name: No secrets in any commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/secretscan/go.mod
      - run: cd tools/secretscan && go run . history
